name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend tests + JaCoCo coverage
        working-directory: backend
        run: ./mvnw -B verify

      - name: Frontend tests + coverage
        working-directory: frontend
        run: |
          npm ci
          npm run coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            backend/target/site/jacoco/
            frontend/coverage/

  docker:
    # Builds both images and checks the stack end to end through the nginx proxy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Smoke test
        run: |
          curl --fail --silent http://localhost:3000/ | grep -q '<div id="app">'
          curl --fail --silent http://localhost:3000/api/disruption-options \
            | jq -e '(.recommendations | length) == 48'

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down

  deploy:
    # Runs only for a push to main whose latest commit message contains DEPLOY,
    # and only after the tests and the Docker smoke test passed
    needs: [build, docker]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && contains(github.event.head_commit.message, 'DEPLOY')
    runs-on: ubuntu-latest
    environment: production
    concurrency: production
    env:
      BACKEND_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
      FRONTEND_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
    steps:
      - name: Trigger Render deploys
        run: |
          if [ -z "$BACKEND_HOOK" ] || [ -z "$FRONTEND_HOOK" ]; then
            echo "::error::DEPLOY was requested, but the secrets RENDER_DEPLOY_HOOK_BACKEND and RENDER_DEPLOY_HOOK_FRONTEND are not set"
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$BACKEND_HOOK"
          curl --fail --silent --show-error --request POST "$FRONTEND_HOOK"
          echo "Render deploys triggered; follow them in each service's Events tab"
