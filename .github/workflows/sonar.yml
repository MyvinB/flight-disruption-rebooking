name: Build, test and Sonar analysis

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # scan is skipped until the secret is configured
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for Sonar blame / new-code detection

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend tests + JaCoCo coverage
        working-directory: backend
        run: ./mvnw -B verify dependency:copy-dependencies -DincludeScope=compile

      - name: Frontend tests + coverage
        working-directory: frontend
        run: |
          npm ci
          npm run coverage
          # lcov paths are relative to frontend/; Sonar resolves them from the repository root
          sed -i 's|^SF:src/|SF:frontend/src/|' coverage/lcov.info

      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_HOST_URL: https://sonarcloud.io
