server.port=8080

# Simulated latency of the mocked sources (ms)
mock.internal.delay-ms=200
mock.external.delay-ms=500
mock.trains.delay-ms=1500

# Global budget for collecting all sources; slower sources are dropped (ms)
disruption.sources.timeout-ms=3000

# Health endpoint for container health checks and load balancers; nothing else is exposed
management.endpoints.web.exposure.include=health
