# SonarQube / SonarCloud analysis of backend (Java) and frontend (Vue + TypeScript) together.
# Generate coverage first: (cd backend && ./mvnw verify) and (cd frontend && npm run coverage)
sonar.projectKey=MyvinB_flight-disruption-rebooking
sonar.organization=myvinb
sonar.projectName=Flight Disruption Rebooking
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/src
sonar.test.inclusions=backend/src/test/java/**,frontend/src/**/__tests__/**
sonar.exclusions=frontend/src/**/__tests__/**

# Java
sonar.java.source=17
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.java.libraries=backend/target/dependency/*.jar

# Coverage reports
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
# Bootstrapping code carries no logic
sonar.coverage.exclusions=backend/src/main/java/**/DisruptionApplication.java,frontend/src/main.ts
